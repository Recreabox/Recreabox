name: Snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%238419b6&color_dots=%23ebedf0,%23d4f7e4,%237fe3ae,%2331d67d,%2315995d
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23c77dff&color_dots=%2316101f,%23214f3a,%23238a5e,%2331d67d,%234fe89a
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
